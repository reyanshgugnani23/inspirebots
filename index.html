<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>InspireBots</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <h1>InspireBots</h1>
  <p>Electronics • Robotics • Innovation</p>
</header>

<section class="customer">
  <input id="custName" placeholder="Your Name">
  <input id="custPhone" placeholder="Phone Number">
</section>

<section class="categories">
  <button onclick="filterCategory('all')">All</button>
  <button onclick="filterCategory('controllers')">Controllers</button>
  <button onclick="filterCategory('drivers')">Motor Drivers</button>
</section>

<section class="products" id="products">
  <div class="product controllers">
    <img src="images/esp32.jpg">
    <h3>ESP32 Dev Board</h3>
    <p>₹450</p>
    <button onclick="addToCart('ESP32 Dev Board', 450)">Add</button>
  </div>

  <div class="product drivers">
    <img src="images/motor.jpg">
    <h3>BTS7960 Motor Driver</h3>
    <p>₹650</p>
    <button onclick="addToCart('BTS7960 Motor Driver', 650)">Add</button>
  </div>
</section>

<section class="cart">
  <h2>Cart</h2>
  <ul id="cartList"></ul>
  <button onclick="placeOrder()">Place Order</button>
</section>

<script src="script.js"></script>
</body>
</html>
